# Renders every scene file in scenes/ whenever you push a change,
# or on demand from the Actions tab ("Run workflow"). No AI involved.
# Download the MP4s from the run page -> Artifacts -> videos.
name: Render videos

on:
  push:
    paths: ['scenes/**', 'videogen/**', 'assets/**', 'render.py']
  workflow_dispatch:
    inputs:
      scene:
        description: 'Scene file to render (leave empty for all)'
        required: false
        default: ''
      hd:
        description: 'Render in 1920x1080'
        type: boolean
        default: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2-dev pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render
        run: |
          EXTRA=""
          if [ "${{ inputs.hd }}" = "true" ]; then EXTRA="--hd"; fi
          if [ -n "${{ inputs.scene }}" ]; then
            python render.py "${{ inputs.scene }}" $EXTRA
          else
            python render.py --all $EXTRA
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: output/*.mp4
          retention-days: 30
