<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#1b1829">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VideoGen Instrument Studio · make music with real instruments</title>
<style>
  @font-face{font-family:"Noto Sans";font-weight:400 700;src:url(../fonts/NotoSans-Bold.ttf) format("truetype")}
  @font-face{font-family:"Noto Sans Telugu";font-weight:400 700;src:url(../fonts/NotoSansTelugu-Bold.ttf) format("truetype")}
  :root{--bg:#100e18;--panel:#1b1829;--panel2:#262238;--line:#363052;--text:#ece9f6;--dim:#a29cbd;--acc:#f0a830;--acc2:#3fb27f;--red:#e5534b;--blue:#4aa3ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Noto Sans","Noto Sans Telugu",system-ui,sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column}
  select,input,button{font:inherit;color:var(--text)}
  button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;white-space:nowrap}
  button:active{transform:scale(.96)} button.on{background:var(--acc);border-color:var(--acc);color:#1a1300;font-weight:700}
  select,input[type=number],input[type=text]{background:#0d0b14;border:1px solid var(--line);border-radius:8px;padding:6px 7px;max-width:100%}
  input[type=range]{accent-color:var(--acc);width:100%}
  header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} header h1 span{color:var(--acc)}
  .bar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#15121f}
  .bar label{color:var(--dim);font-size:12px}
  #play{font-size:18px;min-width:52px;background:var(--acc2);border-color:var(--acc2);color:#04140c;font-weight:700}
  #pos{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px;white-space:nowrap}
  .bar button{padding:6px 9px}
  .sp{flex:1}
  #tracks{padding:6px 8px;display:flex;flex-direction:column;gap:5px}
  .trk{display:grid;grid-template-columns:6px 118px auto 1fr;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 6px 5px 0;overflow:hidden}
  .trk.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .trk .clr{align-self:stretch;border-radius:0 3px 3px 0}
  .trk .nm{overflow:hidden} .trk .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .trk .nm small{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:underline dotted}
  .trk .btns{display:flex;gap:3px} .trk .btns button{padding:4px 7px;font-size:12px;border-radius:7px}
  .trk .btns .m.on{background:var(--red);border-color:var(--red);color:#fff} .trk .btns .s.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .trk canvas{width:100%;height:32px;display:block;background:#0d0b14;border-radius:6px}
  .more{grid-column:1/-1;display:none;padding:6px 8px 4px 14px;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--dim)}
  .trk.open .more{display:flex} .more .sl{display:flex;align-items:center;gap:6px;min-width:150px;flex:1}
  #addTrack{margin:2px 0 0;border-style:dashed;color:var(--dim)}
  #edWrap{flex:1;display:flex;flex-direction:column;min-height:330px;border-top:1px solid var(--line)}
  #edTools{display:flex;gap:5px;align-items:center;padding:6px 8px;flex-wrap:wrap;background:var(--panel)}
  #edTools .t{font-weight:700;margin-right:4px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #edTools button{padding:5px 9px;font-size:13px}
  #roll{flex:1;width:100%;display:block;touch-action:none;background:#0d0b14;min-height:300px}
  #grid{flex:1;overflow:auto;padding:6px 8px 20px}
  table.g{border-collapse:separate;border-spacing:3px}
  table.g th{position:sticky;left:0;background:var(--bg);text-align:right;font-weight:400;color:var(--dim);font-size:12px;padding-right:6px;white-space:nowrap;z-index:1;cursor:pointer}
  table.g td{width:28px;height:30px;min-width:28px;background:#221e33;border-radius:6px;cursor:pointer}
  table.g td.beat{background:#2c2742} table.g td.x{background:var(--acc)} table.g td.o{background:#9b6f22} table.g td.now{outline:2px solid #fff}
  table.g tr.hd td{background:none;height:16px;font-size:10.5px;color:var(--dim);text-align:center;cursor:default}
  .sheet{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end;justify-content:center}
  .sheet.show{display:flex}
  .sheet .box{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:85vh;overflow:auto;padding:14px 14px 22px}
  .sheet h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center} .sheet h3 .x{margin-left:auto}
  .sheet h4{margin:12px 0 6px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
  .opts{display:flex;flex-wrap:wrap;gap:6px} .opts button{font-size:13px}
  .menu button{display:block;width:100%;text-align:left;margin:5px 0;padding:10px 12px}
  .hint{color:var(--dim);font-size:12.5px}
  .mx{background:#1b1729;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
  .mx .top{display:flex;align-items:center;gap:6px} .mx .top b{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mx .top .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .mx .top button{padding:3px 8px;font-size:12px;border-radius:7px} .mx .top .m.on{background:var(--red);border-color:var(--red);color:#fff} .mx .top .s.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .mx .lv{height:7px;background:#0d0b14;border-radius:4px;margin:6px 0 4px;overflow:hidden} .mx .lv i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#3fb950 0 70%,#e3b341 70% 88%,#f85149 88%);background-size:var(--full,300px) 100%}
  .mx .row{display:grid;grid-template-columns:78px 1fr 44px;align-items:center;gap:6px;font-size:12px;color:var(--dim)} .mx .row input{width:100%} .mx .row output{text-align:right;font-variant-numeric:tabular-nums}
  .mx.master{border-color:var(--acc)}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--acc2);color:#04140c;font-weight:700;padding:9px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  #busy{position:fixed;inset:0;background:#000a;z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
  #busy.show{display:flex} #busy .pb{width:220px;height:8px;background:#333;border-radius:4px;overflow:hidden} #busy .pb i{display:block;height:100%;background:var(--acc);width:0}
  .item{display:flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin:4px 0}
  .item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (min-width:800px){ .trk{grid-template-columns:6px 170px auto 1fr} #roll{min-height:420px} }
</style>
</head>
<body>
<header>
  <a href="../" style="text-decoration:none;font-size:18px" title="VideoGen home">🏠</a>
  <h1>🎹 <span>Instrument</span> Studio · <span id="songName" style="color:var(--text);font-weight:400"></span></h1>
  <button id="undo" title="Undo">↶</button><button id="redo" title="Redo">↷</button>
  <button id="menuBtn">☰</button>
</header>
<div class="bar">
  <button id="home" title="Go to start">⏮</button>
  <button id="play">▶</button>
  <button id="loopBtn" title="Repeat (drag on the top ruler to repeat some bars)">🔁</button>
  <button id="metroBtn" title="Metronome click">🥁</button>
  <span id="pos">Bar 1 · 1</span>
  <span class="sp"></span>
  <label title="Speed (beats per minute)">♩</label><input id="bpm" type="number" min="30" max="240" value="90" style="width:58px">
</div>
<div class="bar">
  <label>Key (Sa)</label><select id="key"></select>
  <label>Scale / raga</label><select id="scale" style="max-width:150px"></select>
  <label>Bars</label><input id="bars" type="number" min="1" max="200" value="8" style="width:56px">
  <label>Sound</label><select id="polish" title="Polished = mastering (EQ, warmth, compression, limiter)"><option value="1">Polished</option><option value="0">Natural</option></select>
  <label>Play</label><select id="pmode" title="Smooth = the song is mixed first, then plays without breaking (best on phones). Live = starts instantly, mixer changes heard at once."><option value="1">Smooth</option><option value="0">Live</option></select>
  <label>Gamaka</label><select id="gam" title="Slides and shakes on veena, sitar, flute, violin, shehnai, voice"><option value="0">Off</option><option value="0.5">Light</option><option value="1">Rich</option></select>
  <label>Feel</label><select id="feel" title="Human feel: small timing and loudness changes like real players"><option value="0">Machine</option><option value="0.6">Natural</option><option value="1">Loose</option></select>
  <select id="meter"><option value="4">4/4</option><option value="3">3/4</option><option value="2">2/4</option><option value="6">6/8</option><option value="7">7 beats</option></select>
</div>
<div style="padding:8px 8px 0;display:flex;gap:6px"><button id="oneTap" style="flex:1;padding:11px;font-size:15px;font-weight:700;background:linear-gradient(90deg,#f0a830,#e5534b);border:0;color:#1a0d00">✨ Make a full song in one tap</button><button id="nextTune" title="Same mood, next tune number" style="padding:11px 12px;font-weight:700">🎲 Next tune</button><button id="mixBtn" title="Mixer: volume, left/right, echo, bass, treble for every track" style="padding:11px 12px">🎚️</button></div>
<div id="tracks"></div>
<div id="edWrap">
  <div id="edTools"></div>
  <canvas id="roll"></canvas>
  <div id="grid" style="display:none"></div>
</div>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div id="busy"><div id="busyMsg">Working…</div><div class="pb"><i id="busyBar"></i></div></div>
<div class="toast" id="toast"></div>

<script src="../animate/synth.js"></script>
<script src="../animate/ambience.js"></script>
<script src="../lib/mp4-muxer.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
const S = window.VG_STUDIO, $ = id => document.getElementById(id);
const player = new S.Player();
let song = null, selId = null, undoStack = [], redoStack = [], lastAuto = {};
const uid = () => 't' + Math.random().toString(36).slice(2, 8);
const GROUP_CLR = {'Real · Keys':'#f0a830', 'Real · Strings':'#e5534b', 'Real · Woodwinds':'#3fb27f', 'Real · Brass':'#d9b84a', 'Real · Mallets':'#4aa3ff', 'Indian & synth':'#c46cff', 'Real · Voices':'#ff8fb1', 'Real · Indian & world (recorded)':'#e0a04a', 'Real · Guitars & keys':'#7ab8ff', 'Real · Bells & pads':'#9be0c0', 'Real · World':'#d98a3a', 'Real · Bells':'#8fd6e8'};
const KIT_CLR = {kit:'#8a8aa0', orch:'#c98a5a', tabla:'#e07a3a', mridangam:'#d06a8a', folk:'#9bbf3a', world:'#c9733a', calm:'#6fc3d8'};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));

// ------------------------------------------------------------ song model
function instTrack(inst, name, notes = []){ const I = S.INSTRUMENTS[inst]; return {id:uid(), type:'inst', inst, name:name || (I ? I.label : inst), notes, vol:0.8, pan:0, verb:0.25}; }
function drumTrack(rhythm, name){ const R = S.RHYTHMS[rhythm]; const t = {id:uid(), type:'drum', kit:R.kit, rhythm, name:name || R.name.split(' (')[0], steps:R.steps, stepBeats:R.stepBeats, grid:{}, vol:0.8, pan:0, verb:0.15, from:1, to:0};
  setRhythm(t, rhythm); return t; }
function setRhythm(t, rhythm){ const R = S.RHYTHMS[rhythm]; t.rhythm = rhythm; t.kit = R.kit; t.steps = R.steps; t.stepBeats = R.stepBeats; t.grid = {};
  for(const [row, p] of Object.entries(R.pat)) t.grid[row] = [...p].map(S.velOf); }
function newSong(){ return {v:1, feel:0.6, gamaka:0.5, name:'My song', bpm:90, key:'D', scale:'mohanam', bars:8, meter:4, tracks:[instTrack('r:piano'), drumTrack('keherwa')]}; }
const sel = () => song.tracks.find(t => t.id === selId) || song.tracks[0];

function snapshot(){ return JSON.stringify(song); }
function pushUndo(){ undoStack.push(snapshot()); if(undoStack.length > 60) undoStack.shift(); redoStack = []; }
function changed(opts = {}){ save(); if(!opts.noRefresh) player.refresh(song); if(player.G) S.mixAll(player.G, song); if(!opts.keepUI) renderAll(); else { drawMinis(); drawRoll(); } }
let saveT = 0; function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try{ localStorage.setItem('vg_studio_song', snapshot()); }catch(e){} }, 300); }
function loadSong(s){ player.stop(); song = s; setTimeout(async () => { for(const t of song.tracks) if(t.type === 'audio' && t.blob) await S.clipLoad(t.blob); drawMinis(); renderTracks(); }, 50); song.tracks.forEach(t => t.id = t.id || uid()); selId = song.tracks[0]?.id; player.G = null; player.pos = 0; renderAll(); save(); }

// ------------------------------------------------------------ top bars
function fillTop(){
  $('key').innerHTML = Object.keys(S.KEYS).map(k => `<option>${k}</option>`).join('');
  $('scale').innerHTML = scaleOptions();
}
function scaleOptions(sel){ const groups = {}; for(const [k, v] of Object.entries(S.SCALES)) (groups[v.g || 'Other'] = groups[v.g || 'Other'] || []).push([k, v]);
  return Object.entries(groups).map(([g, list]) => `<optgroup label="${g}">${list.map(([k, v]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${v.name}</option>`).join('')}</optgroup>`).join(''); }
function syncTop(){ $('songName').textContent = song.name; $('bpm').value = song.bpm; $('key').value = song.key; $('scale').value = song.scale; $('bars').value = song.bars; $('meter').value = song.meter; $('feel').value = String(song.feel ?? 0.6); $('polish').value = song.polish === false ? '0' : '1'; $('gam').value = String((song.gamaka ?? 0) >= 0.85 ? 1 : (song.gamaka ?? 0) > 0 ? 0.5 : 0);
  $('loopBtn').classList.toggle('on', player.loop); $('metroBtn').classList.toggle('on', player.metro); }
$('bpm').onchange = () => { pushUndo(); song.bpm = Math.max(30, Math.min(240, +$('bpm').value || 90)); changed({keepUI:true}); };
$('key').onchange = () => { pushUndo(); const d = S.KEYS[$('key').value] - S.KEYS[song.key];
  if(confirm('Move the notes to the new key too?')) song.tracks.forEach(t => t.type === 'inst' && t.notes.forEach(n => n.m += d));
  song.key = $('key').value; changed(); };
$('scale').onchange = async () => { const sc = $('scale').value, nm = S.SCALES[sc].name;
  // a one-tap song can be composed again in the new raga, so the music really changes
  if(song.made && confirm(`Remake this song in ${nm}?\n\nOK = new music in this raga (same mood, length and tune number)\nCancel = only change the scale, keep the notes`)){
    pushUndo(); const was = player.playing; if(was) await togglePlay();
    OT.scale = sc; try{ localStorage.setItem('vg_studio_onetap', JSON.stringify(OT)); }catch(e){}
    const s2 = S.compose({...song.made, scale:sc}); s2.made = {...song.made, scale:sc}; loadSong(s2); renderEditor(); if(was) await togglePlay(); toast('🎵 Remade in ' + nm); return; }
  pushUndo(); song.scale = sc; changed(); };
$('bars').onchange = () => { pushUndo(); song.bars = Math.max(1, Math.min(200, +$('bars').value || 8)); delete song.sections; changed(); };
// ---- smooth play (mix first, then play) ----
try{ const v = localStorage.getItem('vg_smooth'); player.smooth = v != null ? v === '1' : matchMedia('(pointer:coarse)').matches; }catch(e){ player.smooth = true; }
$('pmode').value = player.smooth ? '1' : '0';
$('pmode').onchange = () => { player.smooth = $('pmode').value === '1'; try{ localStorage.setItem('vg_smooth', player.smooth ? '1' : '0'); }catch(e){} if(player.playing){ player.stop(); syncPlay(); }
  toast(player.smooth ? '🎧 Smooth play: the song is mixed first, then plays without breaking' : '⚡ Live play: starts instantly'); };
async function ensureMix(quiet){ if(player.buf && player.bufSong === song && player.bufKey === JSON.stringify(song)) return;
  const sg = song, buf = quiet ? await S.render(sg) : await busy('🎧 Preparing smooth play…', p => S.render(sg, p)); player.buf = buf; player.bufSong = sg; player.bufKey = JSON.stringify(sg); }
let staleT = 0, mixing = false;
player.onstart = () => { syncPlay(); requestAnimationFrame(frame); };
player.onstale = () => { clearTimeout(staleT); staleT = setTimeout(async () => { if(mixing || !player.playing || !player.smooth) return; mixing = true;
  try{ if(player.loop){ await ensureMix(true); if(player.playing && player.smooth) player.start(song, player.position()); } else if(player.playing && player.smooth) await player.startChunks(song, player.position(), true); } finally { mixing = false; }
  if(player.playing && (player.loop ? player.bufKey : player.chunkKey) !== JSON.stringify(song)) player.onstale(); }, 700); };
$('polish').onchange = () => { pushUndo(); song.polish = $('polish').value === '1'; player.G = null; changed({keepUI:true}); toast(song.polish ? 'Polished sound (mastering on)' : 'Natural sound (no mastering)'); };
$('gam').onchange = () => { pushUndo(); song.gamaka = +$('gam').value; changed({keepUI:true}); toast(song.gamaka ? 'Gamakas on: slides and shakes on Indian-style instruments' : 'Gamakas off'); };
$('feel').onchange = () => { pushUndo(); song.feel = +$('feel').value; changed({keepUI:true}); toast(song.feel ? 'Human feel on' : 'Exact machine timing'); };
$('meter').onchange = () => { pushUndo(); song.meter = +$('meter').value; changed(); };
$('undo').onclick = () => { if(!undoStack.length) return; redoStack.push(snapshot()); song = JSON.parse(undoStack.pop()); player.G = null; if(!song.tracks.find(t => t.id === selId)) selId = song.tracks[0]?.id; changed(); };
$('redo').onclick = () => { if(!redoStack.length) return; undoStack.push(snapshot()); song = JSON.parse(redoStack.pop()); player.G = null; changed(); };

// ------------------------------------------------------------ transport
async function togglePlay(){
  if(player.playing){ player.stop(); syncPlay(); return; }
  player.ensure(song);
  if(player.smooth && player.loop) await ensureMix();
  else if(player.smooth){}   // pieces: each piece gets its own sounds ready
  else { const {keys} = needsQuick(); if(keys) await busy('Loading instruments…', p => S.prepare(song, p)); else await S.prepare(song); }
  if(player.smooth && !player.loop){ toast('🎧 Starting…'); await player.startChunks(song, player.pos || 0); }
  else player.start(song, player.pos || 0);
  syncPlay(); requestAnimationFrame(frame);
}
function needsQuick(){ return {keys:true}; }
function syncPlay(){ $('play').textContent = player.playing ? '⏸' : '▶'; }
$('play').onclick = togglePlay;
$('home').onclick = () => { const p = player.playing; player.stop(); player.pos = 0; if(p) player.start(song, 0); drawAllPlayheads(); };
$('loopBtn').onclick = () => { player.loop = !player.loop; if(player.loop && player.loopA == null){ player.loopA = 0; player.loopB = null; } $('loopBtn').classList.toggle('on', player.loop); player.refresh(song); drawRoll(); };
$('metroBtn').onclick = () => { player.metro = !player.metro; $('metroBtn').classList.toggle('on', player.metro); player.refresh(song); };
player.onend = () => { syncPlay(); drawAllPlayheads(); };
document.addEventListener('keydown', e => { if(e.code === 'Space' && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){ e.preventDefault(); togglePlay(); }
  if((e.ctrlKey || e.metaKey) && e.key === 'z'){ e.preventDefault(); (e.shiftKey ? $('redo') : $('undo')).onclick(); } });
const mmss = x => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
function posText(sec){ const b = sec / S.spb(song), bpb = S.beatsPerBar(song); return `Bar ${Math.floor(b / bpb) + 1} · ${mmss(sec)} / ${mmss(S.songSeconds(song))}`; }
// redraw the playhead about 15 times a second (not 60) so the phone has time for the sound
let lastDraw = 0;
function frame(ts){ if(!lastDraw || ts - lastDraw > 66){ lastDraw = ts || 1; drawAllPlayheads(); } if(player.playing) requestAnimationFrame(frame); else lastDraw = 0; }
function drawAllPlayheads(){ const p = player.position(); $('pos').textContent = posText(p); drawMinis(); followRoll(p); drawRoll(); markGrid(p); }

// ------------------------------------------------------------ track list
function trackColor(t){ if(t.type === 'audio') return '#ff7a59'; if(t.type === 'amb') return '#38b6c9'; return t.type === 'drum' ? KIT_CLR[t.kit] || '#888' : GROUP_CLR[(S.INSTRUMENTS[t.inst] || {}).group] || '#888'; }
function ambInfo(id){ return (window.VG_AMB && VG_AMB.LIST.find(a => a.id === id)) || {name:id, icon:'🌿'}; }
function trackSub(t){ if(t.type === 'audio') return '🎙️ ' + (S.clipBufs[t.blob] ? S.clipBufs[t.blob].duration.toFixed(1) + ' s · starts at ' + (t.start || 0).toFixed(1) + ' s' : 'recording'); if(t.type === 'amb'){ const a = ambInfo(t.amb); return a.icon + ' ' + a.name; } return t.type === 'drum' ? (S.KITS[t.kit]?.label || t.kit) + ' · ' + (S.RHYTHMS[t.rhythm]?.name.split(' (')[0] || 'own rhythm') : (S.INSTRUMENTS[t.inst]?.label || t.inst); }
function renderTracks(){
  const box = $('tracks');
  box.innerHTML = song.tracks.map(t => `<div class="trk${t.id === selId ? ' sel' : ''}${t.id === openId ? ' open' : ''}" data-id="${t.id}">
    <div class="clr" style="background:${trackColor(t)}"></div>

function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('videogen_audio', 1); r.onupgradeneeded = () => r.result.createObjectStore('blobs'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(id){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('blobs', 'readonly'), r = tx.objectStore('blobs').get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
S.setClipLoader(async id => { const blob = await idbGet(id); if(!blob) return null; const ab = await blob.arrayBuffer(); const ctx = player.ensure(song).ctx; return await new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej)); });
async function idbPut(id, blob){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('blobs', 'readwrite'); tx.objectStore('blobs').put(blob, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }

let recState = null;
async function recordVoice(t){
  if(recState){ recState.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder) return toast('This browser cannot record', true);
  let stream; try{ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }catch(e){ return toast('Please allow the microphone', true); }
  const G = player.ensure(song); await S.prepare(song);
  const mr = new MediaRecorder(stream), chunks = []; mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  const from = player.pos || 0, lat = (G.ctx.outputLatency || 0) + (G.ctx.baseLatency || 0);
  t.muteWhileRec = true; const wasVol = t.vol; t.vol = 0; S.mixAll(G, song);
  mr.start(); player.start(song, from); syncPlay(); requestAnimationFrame(frame); const t0 = performance.now();
  const bar = document.createElement('div'); bar.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#e5534b;color:#fff;font-weight:700;padding:10px 16px;border-radius:12px;z-index:50;cursor:pointer';
  bar.textContent = '⏺ Recording… tap here to stop'; document.body.appendChild(bar);
  const timer = setInterval(() => { bar.textContent = `⏺ Recording ${((performance.now() - t0) / 1000).toFixed(0)} s… tap to stop`; if(!player.playing) recState && recState.stop(); }, 300);
  recState = {stop:() => { if(mr.state !== 'inactive') mr.stop(); }};
  bar.onclick = () => recState.stop();
  mr.onstop = async () => {
    clearInterval(timer); bar.remove(); stream.getTracks().forEach(x => x.stop()); player.stop(); syncPlay(); recState = null; t.vol = wasVol || 1; delete t.muteWhileRec;
    const blob = new Blob(chunks, {type:mr.mimeType || 'audio/webm'}); if(!blob.size) return toast('Nothing was recorded', true);
    const id = 'studio_voice_' + Date.now(); await idbPut(id, blob); delete S.clipBufs[id]; await S.clipLoad(id);
    pushUndo(); t.blob = id; t.start = Math.max(0, +(from - lat).toFixed(2)); changed(); toast('Voice saved. Press ▶ to hear it with the music');
  };
}
function uploadAudio(t){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'audio/*';
  inp.onchange = async () => { const f = inp.files[0]; if(!f) return; const id = 'studio_voice_' + Date.now(); await idbPut(id, f); await S.clipLoad(id);
    if(!S.clipBufs[id]) return toast('Could not read this audio file', true); pushUndo(); t.blob = id; t.name = f.name.replace(/\.[^.]+$/, '').slice(0, 30) || 'Audio'; changed(); toast('Audio added'); };
  inp.click();
}

  closeSheet(); pushUndo();
  const opts = {mood:OT.mood, seconds:OT.seconds, key:OT.key || null, scale:OT.scale || null, seed:OT.seed, nature:OT.nature || null, lead:OT.mood === 'solo' ? (OT.solo || 's:bansuri') : OT.lead || null, support:OT.mood === 'solo' ? null : OT.support || null, custom:OT.custom, rich:OT.rich !== false, parts:OT.parts || null, rhythm:OT.rhythm || null};

}

    p1.notes = S.auto(s, p1, 'melody', 21).map(n => ({...n, m:n.m < 64 ? n.m + 12 : n.m})); p2.notes = S.auto(s, p2, 'arp', 4).map(n => ({...n, m:n.m > 64 ? n.m - 12 : n.m, v:0.5})); c.notes = S.auto(s, c, 'chords', 2).filter((n, i, a) => n.t >= 8);
    c.vol = 0.5; c.verb = 0.4; d.from = 5; d.vol = 0.55; s.tracks = [p1, p2, c, d]; return s; }},
  kids:{name:'Kids — marimba and xylophone', make(){ const s = {v:1, name:'Happy kids', bpm:116, key:'F', scale:'major', bars:8, meter:4, tracks:[]};
    const ma = instTrack('r:marimba', 'Marimba'), xy = instTrack('r:pizz', 'Strings pizzicato'), gl = instTrack('r:glock', 'Glockenspiel'), d = drumTrack('latin', 'Claves & conga');
    ma.notes = S.auto(s, ma, 'melody', 7); xy.notes = S.auto(s, xy, 'bass', 7).map(n => ({...n, d:0.5})); gl.notes = S.auto(s, gl, 'melody', 7).filter(n => n.t % 4 === 0); gl.vol = 0.45; d.vol = 0.6;
    s.tracks = [ma, xy, gl, d]; return s; }},
  folk:{name:'Village folk — dholak and gajjalu', make(){ const s = {v:1, name:'Village folk', bpm:104, key:'D', scale:'kharaharapriya', bars:8, meter:4, tracks:[]};
    const fl = instTrack('s:bansuri', 'Bansuri'), sa = instTrack('s:santoor', 'Santoor'), d = drumTrack('dholak', 'Dholak + gajjalu');
    fl.notes = S.auto(s, fl, 'melody', 13); sa.notes = S.auto(s, sa, 'arp', 13).map(n => ({...n, v:0.5})); sa.vol = 0.5; s.tracks = [fl, sa, d]; return s; }},
};
function demoSheet(){ sheet('Example songs', `<p class="hint">Open one, listen, then change it. Your current song will be replaced (save it first).</p><div class="menu">${Object.entries(DEMOS).map(([k, d]) => `<button data-d="${k}">🎵 ${esc(d.name)}</button>`).join('')}</div>`,
  box => box.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { closeSheet(); undoStack = []; loadSong(DEMOS[b.dataset.d].make()); toast('Press ▶ to listen'); })); }

// ------------------------------------------------------------ start
function renderAll(){ syncTop(); renderTracks(); renderEditor(); if(window.syncNextTune) syncNextTune(); }
(async () => {
  fillTop();
  try{ await S.load('./samples/'); }catch(e){ toast('Could not load instruments. Check the internet.', true); }
  let s = null; try{ s = JSON.parse(localStorage.getItem('vg_studio_song') || 'null'); }catch(e){}
  const q = new URLSearchParams(location.search).get('demo');
  if(q && DEMOS[q]) s = DEMOS[q].make();
  loadSong(s && s.tracks ? s : DEMOS.bhajan.make());
  if(!s) setTimeout(oneTapSheet, 400);
})();
</script>
